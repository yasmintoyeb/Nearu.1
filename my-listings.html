<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Listings | NearU</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./site-preferences.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8" aria-label="Main navigation">
      <a href="index.html" class="flex items-center gap-2 text-xl font-extrabold tracking-tight whitespace-nowrap">
        <img src="./image/image.png" alt="NearU Logo" class="w-8 h-8 inline-block logo-circle" />
        <span><span class="text-[#5E17EB]">N</span><span class="text-[#FF751F]">ear</span><span class="bg-gradient-to-b from-[#6D3FD1] via-[#A6538D] to-[#E0AA3E] bg-clip-text text-transparent">U</span><span class="text-[#D9A441]">.</span></span>
      </a>
      <div class="flex items-center gap-3">
        <a href="landlords.html" class="text-sm font-medium text-slate-600 hover:text-primary-600">For Landlords</a>
        <a href="listings.html" class="rounded-lg bg-primary-600 px-4 py-2 text-sm font-medium text-white hover:bg-primary-700">See All Public Rentals</a>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-10 sm:px-6 lg:px-8">
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-slate-900">Your submitted listings</h1>
      <p class="mt-2 text-slate-500">Track review status and see inquiries from interested renters.</p>
    </div>
    <p id="my-listings-status" class="mb-5 text-sm text-slate-600" role="status" aria-live="polite">Loading your listings...</p>
    <div id="my-listings-grid" class="grid gap-5 sm:grid-cols-2"></div>
    <a href="listings.html" class="mt-8 inline-flex rounded-lg border border-primary-200 px-4 py-2.5 text-sm font-semibold text-primary-600 hover:bg-primary-50">See all published rentals</a>
    <a href="landlords.html#form" class="mt-8 ml-2 inline-flex rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-primary-700">Submit another listing</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>
  <script src="./my-listings.js"></script>
  <script src="./site-preferences.js"></script>
</body>
</html>
