<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>Create an Account | NearU</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./site-preferences.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8" aria-label="Main navigation">
      <a href="index.html" class="flex items-center gap-2 text-xl font-extrabold tracking-tight whitespace-nowrap">
        <img src="./image/image.png" alt="NearU Logo" class="w-8 h-8 inline-block logo-circle" />
        <span><span class="text-[#5E17EB]">N</span><span class="text-[#FF751F]">ear</span><span class="bg-gradient-to-b from-[#6D3FD1] via-[#A6538D] to-[#E0AA3E] bg-clip-text text-transparent">U</span><span class="text-[#D9A441]">.</span></span>
      </a>
      <div class="flex items-center gap-3">
        <button data-language-toggle type="button" class="text-sm text-slate-500 hover:text-slate-700" aria-label="Switch to Khmer">ខ្មែរ ▾</button>
        <button data-dark-mode-toggle type="button" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-500" aria-label="Turn on dark mode" aria-pressed="false">🌙</button>
        <a href="login.html" class="text-sm font-medium text-primary-600 hover:text-primary-700">Log in</a>
      </div>
    </nav>
  </header>

  <main class="mx-auto flex min-h-[calc(100vh-4rem)] max-w-7xl items-center justify-center px-4 py-12 sm:px-6">
    <section class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8" aria-labelledby="signup-title">
      <div class="mb-8 text-center">
        <h1 id="signup-title" class="text-3xl font-bold text-slate-900">Create your account</h1>
        <p class="mt-2 text-sm text-slate-500">Join NearU to find or list a student home.</p>
      </div>

      <form id="signup-form" class="space-y-5">
        <div>
          <label for="name" class="mb-1.5 block text-sm font-medium text-slate-700">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" required
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-primary-500 focus:ring-2 focus:ring-primary-100"
            placeholder="Your full name" />
        </div>
        <div>
          <label for="email" class="mb-1.5 block text-sm font-medium text-slate-700">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-primary-500 focus:ring-2 focus:ring-primary-100"
            placeholder="you@example.com" />
        </div>
        <div>
          <label for="password" class="mb-1.5 block text-sm font-medium text-slate-700">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-primary-500 focus:ring-2 focus:ring-primary-100"
            placeholder="At least 8 characters" />
        </div>
        <div>
          <label for="confirm-password" class="mb-1.5 block text-sm font-medium text-slate-700">Confirm password</label>
          <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-primary-500 focus:ring-2 focus:ring-primary-100"
            placeholder="Enter your password again" />
        </div>
        <button type="submit" class="w-full rounded-lg bg-primary-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2">
          Create Account
        </button>
        <p id="form-message" class="hidden rounded-lg p-3 text-sm" role="status" aria-live="polite"></p>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500">
        Already have an account? <a href="login.html" class="font-medium text-primary-600 hover:underline">Log in</a>
      </p>
      <a href="index.html" class="mt-6 block text-center text-sm text-slate-500 hover:text-primary-600">← Back to home</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>
  <script src="./auth.js"></script>
  <script src="./site-preferences.js"></script>
</body>
</html>
